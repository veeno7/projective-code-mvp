<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lynex Playable Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050810;
    color: #fff;
    font-family: system-ui, sans-serif;
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .wrap { text-align: center; padding: 24px; }

  h1 {
    font-size: clamp(24px, 6vw, 42px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, #a88fff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    font-size: 14px;
    color: #555;
    margin-bottom: 32px;
    letter-spacing: 0.05em;
  }

  #cta {
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 700;
    background: #7c5cff;
    border: none;
    border-radius: 14px;
    color: white;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  #cta:active { transform: scale(0.96); opacity: 0.85; }
  #cta:disabled { opacity: 0.4; cursor: not-allowed; }

  #status {
    margin-top: 20px;
    font-size: 13px;
    color: #555;
    min-height: 20px;
    transition: color 0.2s;
  }
  #status.ok  { color: #00e676; }
  #status.err { color: #ff5555; }

  /* Error overlay — visible on mobile with no DevTools */
  #err {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    color: #ff5555;
    font-family: monospace;
    font-size: 12px;
    padding: 20px;
    z-index: 999;
    white-space: pre-wrap;
    overflow: auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tap to Install</h1>
  <p>LYNEX 5D PLAYABLE</p>
  <button id="cta">Play Now</button>
  <div id="status">Loading scene...</div>
</div>
<div id="err"></div>

<script>
  var statusEl = document.getElementById('status');
  var ctaBtn   = document.getElementById('cta');
  var errEl    = document.getElementById('err');

  // Visible error overlay for mobile debugging
  window.onerror = function(msg, src, line) {
    errEl.style.display = 'block';
    errEl.textContent += 'ERROR: ' + msg + '\n' + (src || '') + ':' + line + '\n\n';
  };

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type || '';
  }

  // Load playable.js dynamically so it runs after DOM is ready
  var script = document.createElement('script');
  script.src = '/playable.js?v=' + Date.now(); // cache bust every load
  script.onload = function() {
    setStatus('Scene ready.', 'ok');
    ctaBtn.disabled = false;
  };
  script.onerror = function() {
    setStatus('playable.js failed to load.', 'err');
    ctaBtn.disabled = false; // still allow tap even if scene failed
  };
  ctaBtn.disabled = true; // disable until script loads
  document.body.appendChild(script);

  // CTA click handler
  ctaBtn.onclick = function() {
    ctaBtn.disabled = true;
    setStatus('');

    if (typeof startGame === 'function') {
      try { startGame(); } catch(e) { setStatus('startGame error: ' + e.message, 'err'); }
    }

    if (typeof checkout === 'function') {
      try { checkout(); } catch(e) { setStatus('checkout error: ' + e.message, 'err'); }
    } else {
      setStatus('CTA fired!', 'ok');
    }

    // Re-enable after 3s in case nothing navigates away
    setTimeout(function() { ctaBtn.disabled = false; }, 3000);
  };
</script>
</body>
</html>
