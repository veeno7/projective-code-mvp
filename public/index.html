<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5D Editor</title>
<style>
body{font-family:system-ui;background:#0b0f1a;color:#eee;margin:0;padding:20px}
.card{background:#151b2c;padding:16px;border-radius:12px;margin:12px 0}
textarea{width:100%;height:140px;background:#000;color:#0f0;border:1px solid #333;font-family:monospace;font-size:14px}
button{background:#7c5cff;border:0;padding:8px 14px;border-radius:8px;font-weight:600;color:#fff;cursor:pointer}
select,input{width:100%;padding:6px;background:#000;color:#fff;border:1px solid #333;margin-top:4px}
pre{white-space:pre-wrap;background:#000;padding:8px;border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<h1>5D → 4D → 2D</h1>
<div class="card">
  Function (x):
  <select id="fn">
    <option value="0">0: checkout</option>
    <option value="1">1: init</option>
    <option value="2">2: startGame</option>
  </select>
  <div class="row" style="margin-top:8px">
    <div>y (version): <select id="y"><option>0</option><option>1</option><option>2</option></select></div>
    <div>z (variant): <select id="z"><option>0</option><option>1</option></select></div>
  </div>
  <div style="margin-top:8px">w (abstraction): <span id="wv">0.9</span><input id="w" type="range" min="0.3" max="0.9" step="0.3" value="0.9"></div>
  <div>v (context): <span id="vv">1</span><input id="v" type="range" min="0" max="1" step="1" value="1"></div>
</div>
<div class="card">
  <textarea id="ed"></textarea><br>
  <button id="save">Save to 5D</button>
  <button id="gen" style="display:none;background:#00a86b;margin-left:6px">Generate from Intent</button>
  <a href="/export/playable.zip" style="margin-left:8px"><button>Export ZIP</button></a>
  <a href="/map" style="margin-left:8px"><button>5D Map</button></a>
</div>
<div class="card">
  <pre id="out"></pre>
  <button id="run">Run</button>
</div>
<script>
const fn=document.getElementById('fn'),y=document.getElementById('y'),z=document.getElementById('z'),w=document.getElementById('w'),v=document.getElementById('v'),ed=document.getElementById('ed'),out=document.getElementById('out'),wv=document.getElementById('wv'),vv=document.getElementById('vv'),gen=document.getElementById('gen');
async function proj(){wv.textContent=w.value;vv.textContent=v.value;gen.style.display=w.value=='0.3'?'inline-block':'none';const r=await fetch(`/api/project?x=${fn.value}&y=${y.value}&z=${z.value}&w=${w.value}&v=${v.value}`);const d=await r.json();ed.value=out.textContent=d.code;}
async function save(){await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:+fn.value,y:+y.value,z:+z.value,w:+w.value,v:+v.value,code:ed.value})});proj();}
async function generate(){const intent=ed.value;const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:+fn.value,intent})});const d=await r.json();w.value='0.9';await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:+fn.value,y:+y.value,z:+z.value,w:0.9,v:+v.value,code:d.code})});proj();}
document.getElementById('save').onclick=save;gen.onclick=generate;document.getElementById('run').onclick=()=>eval(out.textContent);fn.onchange=y.onchange=z.onchange=w.oninput=v.oninput=proj;proj();
</script>
</body>
</html>
